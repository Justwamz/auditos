# Render blueprint for the AuditOS demo, on free plans. Create it from the repo: New > Blueprint.
# Demo data only. Data residency in Kenya is NOT satisfied by these regions; settle that before real client data.
#
# Free-plan trade-offs: services sleep after 15 minutes idle (the first request then takes up to a minute),
# uploaded evidence files are lost on every restart or deploy (no disk), and the free database is time-limited.
databases:
  - name: auditos-db
    databaseName: auditos
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: auditos-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    # Free services have no pre-deploy step, so the database is prepared on every start (safe to repeat).
    startCommand: pnpm --filter @auditos/api prepare-db && pnpm --filter @auditos/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PG_SUPERUSER_URL
        fromDatabase:
          name: auditos-db
          property: connectionString
      - key: DB_NAME
        value: auditos
      - key: OWNER_PASSWORD
        generateValue: true
      - key: APP_PASSWORD
        generateValue: true
      - key: APP_ENC_KEY
        generateValue: true   # 256-bit base64, the format the API expects
      - key: PLATFORM_ADMIN_TOKEN
        generateValue: true
      - key: UPLOAD_DIR
        value: ./storage       # temporary on the free plan
      - key: TRUST_PROXY_HOPS
        value: 2

  - type: web
    name: auditos-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @auditos/web build
    startCommand: pnpm --filter @auditos/web exec next start -p $PORT
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS          # the free plan has 512 MB; keep the build inside it
        value: --max-old-space-size=450
      - key: API_URL
        sync: false                # after the API deploys, paste its public address, e.g. https://auditos-api-xxxx.onrender.com
